<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゼロサカ統合ホーム｜制作時間から企画を提案</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f2f6f3;color:#17372d;font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif}header{background:#123428;color:#fff;padding:21px 18px}header h1{font-size:22px;margin:0}header p{font-size:12px;margin:7px 0 0;color:#c9e3d4}main{max-width:650px;margin:auto;padding:18px 14px 35px}.panel{background:#fff;border:1px solid #d9e6dd;border-radius:16px;padding:19px;margin-bottom:15px;box-shadow:0 2px 8px #133d2610}h2{font-size:17px;margin:0 0 13px}.muted{color:#587064;font-size:13px;line-height:1.7}.time{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select{font-size:18px;padding:11px 14px;border:1px solid #b7cbbd;border-radius:11px;background:#fff;color:#17372d;min-width:150px}button{font-size:15px;padding:12px 17px;border:0;border-radius:11px;background:#176345;color:#fff;font-weight:700}button:active{opacity:.8}.result{margin-top:15px}.recommend{border:1px solid #d6e5d9;border-radius:13px;padding:13px;margin-top:10px;background:#f9fcfa}.recommend strong{font-size:17px}.recommend p{margin:6px 0 0;font-size:13px;line-height:1.65}.meta{font-size:12px;color:#597363;margin-top:4px}.links{display:grid;gap:12px}.item{display:block;text-decoration:none;background:#fff;border:1px solid #d1e0d5;border-radius:14px;padding:17px 16px;color:#163b2e;font-size:18px;font-weight:800}.item small{display:block;font-size:12px;font-weight:400;color:#536a60;margin-top:6px}.note{background:#fff8e7;border-radius:11px;padding:12px 14px;font-size:12px;line-height:1.7;color:#6b562b}footer{font-size:12px;color:#607267;line-height:1.7;margin-top:16px}
</style></head><body><header><h1>⚽ ゼロサカ統合ホーム</h1><p>制作時間に合わせて、今日の企画を考える</p></header><main>
<section class="panel"><h2>今日、制作に使える時間は？</h2><div class="time"><label for="time" class="muted">制作時間</label><select id="time"><option value="0.5">30分</option><option value="1">1時間</option><option value="1.5">1時間30分</option><option value="2">2時間</option><option value="2.5">2時間30分</option><option value="3">3時間</option><option value="4">4時間</option><option value="5">5時間</option><option value="6">6時間</option><option value="7">7時間</option><option value="8">8時間</option></select><button id="suggest" type="button">企画を提案</button></div><div class="result" id="result" aria-live="polite"></div></section>
<section class="panel"><h2>アプリを開く</h2><div class="links"><a class="item" href="./zerosaka-analytics-nav-test.html">📊 分析アプリを開く<small>分析 v2.4.0 ／ Google認証・同期は従来どおり</small></a><a class="item" href="./zerosaka-video-manager-nav-test.html">📝 動画カルテを開く<small>保存済みの動画・台本・進捗を確認</small></a></div></section>
<div class="note">この版のおすすめは、企画ごとの目安制作時間だけで判定します。分析実績やカルテの制作状況はまだ自動取得していません。表示は制作時間の目安で、完成を保証するものではありません。</div><footer>統合ホーム機能テスト版。既存の分析・カルテのプログラム、認証、保存データは変更しません。</footer>
</main><script>
(function(){'use strict';
const projects=[
{name:'クイズ',hours:.5,why:'短時間で取り組みやすい参加型Shorts。'},
{name:'CHOICE',hours:.5,why:'短時間で作りやすい選択型Shorts。'},
{name:'PREVIEW',hours:1,why:'注目試合がある日に向いた試合前Shorts。'},
{name:'REVIEW',hours:1,why:'試合後に注目ポイントを1つ掘り下げるShorts。'},
{name:'レイとゼロからサッカー',hours:1,why:'身近なサッカーの疑問を解説するShorts。'},
{name:'レイのサカトピ',hours:3,why:'ニュースを扱うレイ単独の通常動画。'},
{name:'PROJECT 0',hours:6,why:'会話劇の制作。企画・素材の準備状況に合わせて進める。'},
{name:'検証企画',hours:6,why:'調査と構成にまとまった時間を使う通常動画。'}
];
const sel=document.getElementById('time'),out=document.getElementById('result');
const key='zerosaka-unified-home-time-v1';
try{const old=localStorage.getItem(key);if(old&&[...sel.options].some(o=>o.value===old))sel.value=old;else sel.value='1';}catch(e){sel.value='1';}
function fmt(n){return n===.5?'30分':Number.isInteger(n)?n+'時間':Math.floor(n)+'時間30分';}
function render(){const hours=Number(sel.value);try{localStorage.setItem(key,sel.value)}catch(e){}
const eligible=projects.filter(p=>p.hours<=hours);
if(!eligible.length){out.textContent='この時間で制作できる企画は、まだ登録されていません。';return;}
// 時間内に収まる候補を優先。制作時間が同じものは元の企画順。
const ranked=eligible.map((p,i)=>({p,i})).sort((a,b)=>b.p.hours-a.p.hours||a.i-b.i).slice(0,3);
out.replaceChildren();const heading=document.createElement('div');heading.className='muted';heading.textContent='今日のおすすめ（最大3企画・制作時間から選定）';out.append(heading);
ranked.forEach(({p},i)=>{const card=document.createElement('div');card.className='recommend';const title=document.createElement('strong');title.textContent=(i===0?'おすすめ：':'候補：')+p.name;const meta=document.createElement('div');meta.className='meta';meta.textContent='制作目安 '+fmt(p.hours);const why=document.createElement('p');why.textContent=p.why;card.append(title,meta,why);out.append(card)});
const note=document.createElement('p');note.className='muted';note.textContent='※ 話題の鮮度・企画の実績・制作中の動画は、まだ判定に含まれていません。';out.append(note);
}
document.getElementById('suggest').addEventListener('click',render);sel.addEventListener('change',render);render();
})();
</script></body></html>
