<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゼロサカ｜YouTube連携テスト</title><style>body{margin:0;background:#101827;color:#f5f6fa;font-family:system-ui,sans-serif;padding:24px}main{max-width:620px;margin:auto}h1{font-size:26px}p{line-height:1.8;color:#cbd5e1}button{background:#d6ad55;color:#121212;border:0;border-radius:12px;padding:15px 20px;font-size:17px;font-weight:700;width:100%;margin:12px 0}button:disabled{opacity:.5}.panel{background:#1d293b;border-radius:14px;padding:18px;margin-top:18px}pre{white-space:pre-wrap;word-break:break-word;font-size:13px}small{color:#aab5c5}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><main><h1>ゼロサカ｜YouTube連携テスト</h1><p>これはログインとデータ取得を確かめるテストページです。以前の121本の分析データは含まれていません。</p><button id="login">Googleでログインして接続</button><div class="panel"><strong>接続状況</strong><p id="status">まだ接続していません。</p><div id="results"></div></div><p><small>Googleの許可画面ではYouTubeの分析データを読み取る権限を求めます。データはこのブラウザ上で取得し、当サイトのサーバーには保存しません。テストモードの認証は一定期間で再認証が必要になることがあります。</small></p></main><script>
const CLIENT_ID='776233725459-mg7p29uhbiekhvqt0l5l66s5uj72tihc.apps.googleusercontent.com';
const statusEl=document.getElementById('status'),results=document.getElementById('results'),button=document.getElementById('login');
const say=s=>statusEl.textContent=s;
function fmt(n){return Number(n).toLocaleString('ja-JP')}
async function fetchJSON(url,token){const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'HTTP '+r.status);return j}
async function onToken(resp){if(resp.error){say('ログインできませんでした: '+resp.error);return}say('認証成功。YouTubeデータを取得しています…');try{const token=resp.access_token;const ch=await fetchJSON('https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true',token);const name=ch.items?.[0]?.snippet?.title;if(!name)throw new Error('YouTubeチャンネルが見つかりません。管理しているGoogleアカウントを選んでください。');const end=new Date();end.setUTCDate(end.getUTCDate()-2);const start=new Date(end);start.setUTCDate(start.getUTCDate()-27);const date=d=>d.toISOString().slice(0,10);const a=await fetchJSON('https://youtubeanalytics.googleapis.com/v2/reports?'+new URLSearchParams({ids:'channel==MINE',startDate:date(start),endDate:date(end),metrics:'views,estimatedMinutesWatched,subscribersGained',dimensions:'day',sort:'day'}),token);const rows=a.rows||[];const sums=[0,0,0];rows.forEach(row=>{for(let i=0;i<3;i++)sums[i]+=Number(row[i+1]||0)});results.replaceChildren();const h=document.createElement('h2');h.textContent=name;results.append(h);const p=document.createElement('p');p.textContent=`取得期間: ${date(start)} ～ ${date(end)}（直近28日・集計反映のため2日前まで）`;results.append(p);const v=document.createElement('p');v.textContent=`再生数: ${fmt(sums[0])} 回 ／ 視聴時間: ${(sums[1]/60).toFixed(1)} 時間 ／ 登録者獲得: +${fmt(sums[2])} 人`;results.append(v);say('YouTubeとの接続に成功しました！');}catch(e){say('取得エラー: '+e.message+'。Google CloudのAPI・権限・ログインアカウントを確認してください。')}}
button.addEventListener('click',()=>{if(!window.google?.accounts?.oauth2){say('Googleログインの読み込み中です。数秒後にもう一度押してください。');return}const c=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/yt-analytics.readonly',callback:onToken,error_callback:e=>say('ログインエラー: '+(e.type||'不明'))});c.requestAccessToken({prompt:'consent'})});
</script></body></html>
