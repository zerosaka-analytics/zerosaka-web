<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゼロサカ統合｜認証テスト</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f6f3;color:#163829;font-family:system-ui,sans-serif}header{padding:13px 15px;background:#123428;color:white;font-size:17px;font-weight:800}nav{display:flex;gap:8px;padding:10px;background:white}button{flex:1;border:0;border-radius:10px;padding:13px 6px;font-size:16px;font-weight:700;background:#e2ece6;color:#163829}button[aria-selected=true]{background:#16794f;color:white}.note{padding:8px 12px;background:#fff5db;font-size:12px}iframe{width:100%;height:calc(100dvh - 145px);border:0;background:white;display:none}iframe.active{display:block}</style></head>
<body><header>⚽ ゼロサカ統合｜認証テスト</header><nav><button id="analysisBtn" aria-selected="true">分析</button><button id="cardsBtn" aria-selected="false">動画カルテ</button></nav><div class="note">認証テスト専用。登録・削除は行わないでください。</div>
<iframe id="analysisFrame" class="active" src="./" title="ゼロサカ分析" allow="clipboard-read; clipboard-write"></iframe>
<iframe id="cardsFrame" src="./zerosaka-video-manager-test.html" title="ゼロサカ動画カルテ" allow="clipboard-read; clipboard-write" loading="lazy"></iframe>
<script>const a=document.getElementById('analysisBtn'),c=document.getElementById('cardsBtn'),af=document.getElementById('analysisFrame'),cf=document.getElementById('cardsFrame');function show(which){const isA=which==='analysis';a.setAttribute('aria-selected',String(isA));c.setAttribute('aria-selected',String(!isA));af.classList.toggle('active',isA);cf.classList.toggle('active',!isA)}a.addEventListener('click',()=>show('analysis'));c.addEventListener('click',()=>show('cards'));</script></body></html>
