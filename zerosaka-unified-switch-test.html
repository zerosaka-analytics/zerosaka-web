ent.getElementById('view-tools');\nif(!tools)return;\nconst heading=tools.querySelector('.app-view-title');\nif(heading)heading.textContent='データ・設定';\nconst sub=tools.querySelector('.app-view-sub');\nif(sub)sub.textContent='分析結果のコピー・CSV保存・必要なときだけ詳細検証';\nconst early=document.getElementById('earlyPanel');\nif(early){\n const h=early.querySelector('h2');\n if(h)h.innerHTML='公開後7・14・30日の比較 <span class=\"pill\">詳細<\/span>';\n const notes=early.querySelectorAll('.notes');\n if(notes.length>1){\n  const disclosure=document.createElement('details');\n  disclosure.className='method-notes';\n  const sum=document.createElement('summary');\n  sum.textContent='集計方法と注意事項を見る';\n  disclosure.append(sum);\n  notes.forEach(n=>disclosure.append(n));\n  early.append(disclosure);\n }\n}\nconst advanced=document.createElement('details');\nadvanced.className='advanced-wrap';\nconst summary=document.createElement('summary');\nsummary.innerHTML='詳細分析・検証を開く<small>公開後7・14・30日比較、1本検証、企画別レポートなど<\/small>';\nadvanced.append(summary);\nfor(const id of ['earlyPanel','verifyPanel','sharePanel']){\n const p=document.getElementById(id);\n if(p)advanced.append(p);\n}\nconst actions=tools.querySelector('.tool-actions');\nif(actions)actions.insertAdjacentElement('afterend',advanced);\nelse tools.prepend(advanced);\nconst guide=[...tools.querySelectorAll('.panel')].find(p=>p.querySelector('h2')?.textContent.includes('指標の見方'));\nif(guide){\n const more=document.createElement('details');more.className='advanced-wrap';\n const title=document.createElement('summary');title.textContent='指標の説明を見る';more.append(title);more.append(guide);\n advanced.insertAdjacentElement('afterend',more);\n}\n})();<\/script>\n<style id=\"v2311status\">#view-tools .tool-actions #earlyStatus{margin:7px 0 14px;padding:12px;border-radius:9px;background:#f3f7f4;border:1px solid #dce6de;font-size:14px;line-height:1.6;white-space:pre-wrap}#view-tools .tool-actions #earlyExportAll:disabled{opacity:.6}<\/style>\n<script id=\"v2311fix\">(()=>{\nconst tools=document.getElementById('view-tools');\nconst action=tools?.querySelector('.tool-actions');\nconst btn=document.getElementById('earlyExportAll');\nconst status=document.getElementById('earlyStatus');\nif(!action||!btn||!status)return;\n// The status was inside a collapsed details section; users could not see auth/error/progress messages.\nbtn.insertAdjacentElement('afterend',status);\nstatus.setAttribute('aria-live','polite');\nstatus.textContent='全動画の詳細データを保存する前に、ホームでYouTubeデータを更新してください。';\nbtn.addEventListener('click',()=>{\n if(!accessToken){status.textContent='Google未接続です。ホームに戻り「YouTubeデータを更新」を押してから、もう一度お試しください。';return;}\n status.textContent='保存処理を開始します。動画数によって時間がかかります。';\n}, {capture:true});\n})();<\/script>\n<style id=\"v240final\">\n/* Final mobile-first cleanup: existing data and event handlers stay intact. */\nbody{background:#f5f7f5}\nmain{max-width:950px}\n.app-nav{gap:9px}\n.app-nav button{min-height:66px;font-size:15px;box-shadow:none}\n.app-view-title{font-size:19px;margin:16px 0 4px}\n.panel{box-shadow:0 1px 3px #173b2b08}\n#view-home .app-view-sub{margin-bottom:12px}\n#view-home #connect{font-size:16px;min-height:54px;flex:2 1 190px}\n#view-home #period{min-height:54px;flex:1 1 120px}\n#view-home #restore{width:100%}\n#view-home #liveStatus{font-weight:600}\n#view-analysis .panel{margin:12px 0}\n#view-analysis .controls .btn{min-height:48px}\n#view-tools .tool-actions .btn{min-height:50px}\n#view-tools .notice{font-size:12px}\n@media(max-width:450px){.app-nav button{min-height:64px;padding:10px 4px;font-size:14px}#view-home .controls{gap:9px}#view-home #connect{width:100%;flex-basis:100%}#view-home #period{flex:1 1 100%}.app-view{padding-bottom:16px}}\n<\/style><\/body><\/html>", cards: "<!doctype html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>ゼロサカ動画カルテ v1.2.6<\/title><style>\n:root{font-family:system-ui,-apple-system,sans-serif;color:#172b22;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}header{background:#142d24;color:white;padding:18px 16px}header h1{font-size:21px;margin:0}header small{opacity:.8}main{max-width:780px;margin:auto;padding:14px}nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}button,.btn{font:inherit;border:0;border-radius:10px;padding:12px;cursor:pointer;font-weight:700}nav button{background:#e3ebe6;color:#17372a}nav button.active,.primary{background:#14784c;color:#fff}.panel{background:white;border:1px solid #dbe5df;border-radius:14px;padding:16px;margin-bottom:14px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:14px 0 8px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #c6d4cb;border-radius:9px;padding:12px;font:inherit;background:white;color:#172b22}textarea{min-height:135px;resize:vertical}#hook{min-height:75px}#memo{min-height:75px}.hint,.muted{font-size:12px;color:#64756b;line-height:1.6}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}.secondary{background:#e8f0eb;color:#174a32}.danger{background:#fff0ef;color:#aa352e}.item{border:1px solid #dbe5df;border-radius:12px;padding:12px;margin:10px 0;cursor:pointer}.item strong{display:block}.tag{font-size:12px;background:#e7f3eb;border-radius:20px;padding:3px 8px;display:inline-block;margin:5px 5px 0 0}.stat{font-size:13px;line-height:1.8;background:#f1f6f2;padding:10px;border-radius:9px}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.goal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.goal label{margin:0;font-weight:400;border:1px solid #dce5df;padding:10px;border-radius:9px}.goal input{width:auto}.notice{white-space:pre-wrap;background:#eff6f1;padding:12px;border-radius:10px;font-size:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comparecard{min-width:0;overflow-wrap:anywhere}.comparecard p{white-space:pre-wrap;font-size:13px}footer{text-align:center;color:#75877c;font-size:11px;padding:18px}@media(max-width:420px){.two{grid-template-columns:1fr}header h1{font-size:19px}}.list-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 10px}.list-switch button{padding:12px 6px}.list-switch .secondary{background:#e8f0eb;color:#174a32}.missing-summary{background:#fff3df;border:1px solid #e5ba73;color:#71450c;border-radius:10px;padding:11px 12px;margin:10px 0;font-weight:700;font-size:13px}.missing-note{background:#fff7e9;border-left:3px solid #d99527;color:#795012;border-radius:4px;padding:7px 9px;margin-top:9px;font-size:12px;font-weight:700}.missing-summary.hidden{display:none!important}.youtube-gap{background:#fff9ee;border:1px solid #e5ba73;border-radius:10px;padding:12px;margin:12px 0}.youtube-gap h3{margin:0 0 8px}.youtube-gap-item{padding:10px 0;border-top:1px solid #ead8b8;font-size:13px}.youtube-gap-item strong{display:block;overflow-wrap:anywhere}.youtube-gap-item button{margin-top:7px;padding:8px 12px}.youtube-gap .muted{margin:5px 0}<\/style><\/head><body><header><h1>⚽ ゼロサカ動画カルテ<\/h1><small>制作記録 × 公開後の成績｜v1.2.6<\/small><\/header><main>\n<nav><button data-tab=\"list\" class=\"active\">動画一覧<\/button><button data-tab=\"edit\">カルテ作成<\/button><button data-tab=\"data\">データ・設定<\/button><\/nav>\n<section id=\"tab-list\"><div class=\"panel\"><h2>動画一覧<\/h2><button type=\"button\" class=\"primary\" id=\"syncYouTube\" style=\"width:100%;margin-bottom:8px\">YouTubeと同期・更新<\/button><div id=\"syncStatus\" class=\"notice\" role=\"status\" aria-live=\"polite\" style=\"margin-bottom:12px\">Googleアカウントで接続して、公開済み動画を照合します。<\/div><input id=\"search\" placeholder=\"タイトル・企画・台本を検索\"><div class=\"row\"><select id=\"filterKind\"><option value=\"\">全形式<\/option><option>通常動画<\/option><option>Shorts<\/option><\/select><select id=\"filterStatus\"><option value=\"\">全進捗<\/option><option>企画中<\/option><option>台本制作中<\/option><option>素材制作中<\/option><option>動画編集中<\/option><option>公開準備完了<\/option><option>公開済み<\/option><\/select><\/div><div class=\"list-switch\" role=\"group\" aria-label=\"動画一覧の表示切替\"><button type=\"button\" id=\"showWorking\" class=\"primary\" aria-pressed=\"true\">制作中<\/button><button type=\"button\" id=\"showPublished\" class=\"secondary\" aria-pressed=\"false\">公開済み<\/button><\/div><div id=\"missingSummary\" class=\"missing-summary hidden\" role=\"status\"><\/div><div id=\"youtubeGaps\" class=\"youtube-gap hidden\" aria-live=\"polite\"><\/div><div id=\"count\" class=\"hint\"><\/div><div id=\"items\"><\/div><\/div><\/section>\n<section id=\"tab-edit\" class=\"hidden\"><div class=\"panel\"><h2>ChatGPTから一括入力<\/h2><p class=\"hint\">企画室で出力した「ゼロサカ動画カルテ登録用JSON」を貼り付けてください。確認後に編集欄へ反映します。貼り付けだけでは保存されません。<\/p><textarea id=\"pasteCard\" placeholder=\"ChatGPTの登録用JSONをここに貼り付け\" style=\"min-height:105px\"><\/textarea><button type=\"button\" class=\"secondary\" id=\"previewImport\" style=\"width:100%\">内容を確認<\/button><div id=\"importPreview\" class=\"notice hidden\" style=\"margin-top:10px\"><\/div><button type=\"button\" class=\"primary hidden\" id=\"applyImport\" style=\"width:100%;margin-top:8px\">編集欄に反映する<\/button><\/div><div class=\"panel\"><h2 id=\"editHeading\">新しい動画カルテ<\/h2><form id=\"form\"><input id=\"recordId\" type=\"hidden\"><label>動画の種類<\/label><select id=\"kind\"><option>通常動画<\/option><option>Shorts<\/option><\/select><label>企画名 *<\/label><select id=\"project\" required><\/select><label>タイトル *<\/label><input id=\"title\" required placeholder=\"仮タイトルでもOK\"><label>台本 *<\/label><textarea id=\"script\" placeholder=\"企画中は未完成の台本でも下書き保存できます\"><\/textarea><p class=\"hint\">企画中は台本が未完成でも保存可能。公開済みにする際は必須です。<\/p><label>冒頭フック<\/label><textarea id=\"hook\" placeholder=\"動画の最初に伝える言葉\"><\/textarea><label>狙い（複数選択）<\/label><div class=\"goal\" id=\"goals\"><\/div><label>狙いの補足（任意）<\/label><textarea id=\"memo\" placeholder=\"例：サムネで意外性を出してクリック率を上げる\"><\/textarea><label>進捗 *<\/label><select id=\"status\"><option>企画中<\/option><option>台本制作中<\/option><option>素材制作中<\/option><option>動画編集中<\/option><option>公開準備完了<\/option><option>公開済み<\/option><\/select><label>公開日（公開後に登録）<\/label><input id=\"date\" type=\"date\"><label>YouTube URLまたは動画ID（公開後に登録）<\/label><input id=\"youtube\" placeholder=\"YouTubeの共有URLを貼り付ければOK\"><p class=\"hint\" id=\"idHint\">共有URLから動画IDを自動で読み取ります。<\/p><div class=\"actions\"><button class=\"primary\" type=\"submit\">カルテを保存<\/button><button class=\"secondary\" type=\"button\" id=\"cancel\">一覧に戻る<\/button><\/div><\/form><div id=\"editNotice\" class=\"notice hidden\"><\/div><div id=\"recordStats\" class=\"stat hidden\"><\/div><div id=\"reportArea\" class=\"hidden\" style=\"margin-top:14px\"><h3>センセイ提出用レポート<\/h3><p class=\"hint\">台本とCSV分析結果をまとめてコピーします。サムネ画像が必要な場合は別途センセイに添付してください。<\/p><button id=\"copyReport\" class=\"primary\" type=\"button\" style=\"width:100%\">この動画のレポートをコピー<\/button><div id=\"reportNotice\" class=\"hint\"><\/div><\/div><div class=\"actions\" style=\"margin-top:12px\"><button id=\"delete\" class=\"danger hidden\">このカルテを削除<\/button><\/div><\/div><\/section>\n\n<section id=\"tab-data\" class=\"hidden\"><div class=\"panel\"><h2>分析アプリへ制作記録を送信<\/h2><p class=\"hint\">制作記録をJSONファイルとして保存します。分析アプリ側でこのファイルを読み込んでください。YouTube動画IDがないカルテも保留用として含まれます。<\/p><button class=\"primary\" type=\"button\" id=\"exportProduction\" style=\"width:100%\">制作記録を送信用JSONで保存<\/button><div id=\"exportStatus\" class=\"notice\" role=\"status\" style=\"margin-top:10px\">送信用ファイルはまだ作成していません。<\/div><\/div><div class=\"panel\"><h2>バックアップ<\/h2><p class=\"hint\">データはこのブラウザ内に保存されます。端末変更・ブラウザデータ削除に備えて定期的にバックアップしてください。<\/p><div class=\"actions\"><button class=\"primary\" id=\"backup\">全データを保存（JSON）<\/button><label class=\"btn secondary\" style=\"text-align:center\">バックアップを復元<input id=\"restore\" type=\"file\" accept=\".json,application/json\" style=\"display:none\"><\/label><\/div><p class=\"hint\">復元すると現在のカルテと読み込み済み成績が置き換わります。<\/p><\/div><\/section>\n<\/main><footer>ゼロサカ動画カルテ｜データは端末のブラウザ内に保存<\/footer><script>\n(()=>{'use strict';\nconst KEY='zerosaka-video-cards-v1 st next=cards.map(c=>{\n   if(c.youtubeId||c.status==='公開済み')return c;\n   const hits=matches.get(norm(c.title))||[];\n   if(hits.length!==1){if(hits.length>1)ambiguous++;else unmatched++;return c}\n   const v=hits[0];if(occupied.has(v.id)||cards.filter(x=>!x.youtubeId&&norm(x.title)===norm(c.title)).length!==1){ambiguous++;return c}\n   occupied.add(v.id);changed++;\n   return {...c,youtubeId:v.id,date:v.date,status:'公開済み',updatedAt:new Date().toISOString()};\n  });\n  // Cache only a fully retrieved successful public-video audit. Never modify old cards.\n  const audit={checkedAt:new Date().toISOString(),videos:videos.filter(v=>v.date>=AUDIT_FROM)};\n  if(changed){localStorage.setItem(KEY,JSON.stringify(next));localStorage.setItem(SYNC_CACHE,JSON.stringify(audit));sessionStorage.setItem('zs-sync-result','同期完了：'+changed+'本を公開済みに更新。未一致 '+unmatched+'本／要確認 '+ambiguous+'本。');window.location.reload();return}\n  localStorage.setItem(SYNC_CACHE,JSON.stringify(audit));\n  if(typeof window.zerosakaRefreshList==='function')window.zerosakaRefreshList();\n  setStatus('同期完了：公開済み'+videos.length+'本を確認。新規一致 '+changed+'本／未一致 '+unmatched+'本／要確認 '+ambiguous+'本。タイトルが一致しない動画は変更していません。');\n }catch(e){setStatus('同期できませんでした：'+e.message)}finally{button.disabled=false}\n}\nbutton.addEventListener('click',()=>{\n if(!window.google?.accounts?.oauth2){setStatus('Googleログインを準備中です。数秒後にもう一度押してください。');return}\n const client=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/youtube.readonly',callback:r=>{if(r.error){setStatus('認証エラー：'+r.error);return}sync(r.access_token)},error_callback:e=>setStatus('ログインエラー：'+(e.type||'不明'))});\n client.requestAccessToken({prompt:'select_account'});\n});\n})();\n<\/script><\/body><\/html>\n"};
